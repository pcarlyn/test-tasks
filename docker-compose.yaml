services:
  db:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    networks:
      - appnetwork
    volumes:
      - ./src/internal/utils/database/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: .
    container_name: go-fiber
    command: go run main.go
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: postgres
    depends_on:
      - db
    networks:
      - appnetwork

networks:
  appnetwork:
    driver: bridge